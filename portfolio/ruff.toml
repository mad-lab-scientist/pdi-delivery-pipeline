# Python lint settings for network/, cloud/ and security/ (run: ruff check .)
target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # CLI tools: branches/args/thresholds
    "PLW2901",                                                # loop-variable reassignment is idiomatic in parsers
]

[lint.per-file-ignores]
"**/tests/*.py" = ["E402", "PLC0415"]
