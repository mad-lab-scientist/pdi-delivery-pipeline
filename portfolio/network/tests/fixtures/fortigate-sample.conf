#config-version=FGT60F-7.2.11-FW-build1740-250917:opmode=0:vdom=0:user=admin
#conf_file_ver=58219371726345
#buildno=1740
#global_vdom=1
config system global
    set admin-forticloud-sso-login enable
    set admintimeout 30
    set hostname "edge-fw01"
    set strong-crypto disable
end
config system interface
    edit "wan1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 10.20.0.1 255.255.254.0
        set allowaccess ping https ssh http
        set role lan
    next
    edit "dmz"
        set vdom "root"
        set ip 10.20.4.1 255.255.255.0
        set allowaccess ping
        set role dmz
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
    next
    edit "netops"
        set trusthost1 10.20.3.0 255.255.255.128
        set accprofile "super_admin"
        set vdom "root"
    next
end
config firewall address
    edit "LAN_SUBNET"
        set subnet 10.20.0.0 255.255.254.0
    next
    edit "GUEST_NET"
        set subnet 10.20.6.0 255.255.255.0
    next
    edit "WEB01"
        set subnet 10.20.4.10 255.255.255.255
    next
end
config firewall addrgrp
    edit "LAN_GRP"
        set member "LAN_SUBNET"
    next
end
config firewall policy
    edit 1
        set name "LAN-Internet"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "LAN_SUBNET"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set webfilter-profile "default"
        set ips-sensor "default"
        set application-list "default"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "Guest-Internet"
        set srcintf "guest"
        set dstintf "wan1"
        set action accept
        set srcaddr "GUEST_NET"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 3
        set name "Inbound-Web"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "HTTPS"
    next
    edit 4
        set name "Any-Any"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set comments "temporary - \"remove after migration\""
    next
    edit 5
        set name "Web-Admin"
        set srcintf "internal"
        set dstintf "dmz"
        set action accept
        set srcaddr "LAN_SUBNET"
        set dstaddr "WEB01"
        set schedule "always"
        set service "HTTPS"
    next
    edit 6
        set name "Block-RDP"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "LAN_GRP"
        set dstaddr "all"
        set schedule "always"
        set service "RDP"
    next
    edit 7
        set name "Old-Rule"
        set status disable
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "LAN_SUBNET"
        set dstaddr "all"
        set schedule "always"
        set service "FTP"
    next
end
config vpn ssl settings
    set status enable
    set source-interface "wan1"
    set source-address "all"
end
