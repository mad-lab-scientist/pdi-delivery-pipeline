!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
hostname core-sw01
!
logging buffered 64000 informational
logging host 10.20.3.20
logging trap informational
enable algorithm-type scrypt secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
!
username breakglass privilege 15 algorithm-type scrypt secret 9 $9$5sbbCmVsTFcuHU$1v4BWUnTXz3t7pQnXgwm8Ae6kqZq7W6fG3FOrWy6S1Q
!
no ip source-route
no ip http server
ip http secure-server
ip ssh version 2
login block-for 120 attempts 5 within 60
no cdp run
!
ntp server 10.20.3.21 prefer
!
snmp-server group NETOPS v3 priv read NETOPS-VIEW access SNMP-ACL
!
interface Vlan30
 ip address 10.20.3.2 255.255.255.128
 no ip proxy-arp
!
interface GigabitEthernet1/0/10
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
!
ip access-list standard MGMT-ACL
 permit 10.20.3.0 0.0.0.127
!
banner login ^C Authorized access only. Activity is logged. ^C
!
line con 0
 exec-timeout 10 0
line vty 0 15
 access-class MGMT-ACL in
 exec-timeout 10 0
 transport input ssh
!
end
