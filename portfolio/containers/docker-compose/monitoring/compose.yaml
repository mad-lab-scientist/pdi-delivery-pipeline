---
# Self-hosted monitoring stack: Prometheus, Alertmanager, Grafana, node/blackbox/cadvisor exporters.
# Pinned image digests belong in production; tags are shown here for readability.
#   docker compose config    # validate
#   docker compose up -d
name: monitoring

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.external-url=https://prometheus.example.com
    volumes:
      - ../../../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../../../observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
      - ./secrets:/etc/alertmanager/secrets:ro
    ports:
      - "127.0.0.1:9093:9093"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.example.com
    secrets: [grafana_admin]
    volumes:
      - ../../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.systemd
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9115:9115"
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8080:8080"
    logging: *default-logging

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  grafana_admin:
    file: ./secrets/grafana_admin
