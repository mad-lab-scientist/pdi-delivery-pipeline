---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - configmap.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  - name: registry.example.com/storefront/web
    newTag: 1.8.3
