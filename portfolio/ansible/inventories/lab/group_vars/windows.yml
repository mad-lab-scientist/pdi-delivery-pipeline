---
# WinRM over HTTPS with Kerberos (domain accounts); the password is supplied from Ansible Vault.
ansible_connection: winrm
ansible_port: 5986
ansible_winrm_transport: kerberos
ansible_winrm_server_cert_validation: validate
ansible_user: svc-ansible@CORP.EXAMPLE.COM
ansible_password: "{{ vault_windows_ansible_password }}"

windows_baseline_disable_print_spooler: true
windows_baseline_dns_servers: "{{ site_dns_servers }}"
