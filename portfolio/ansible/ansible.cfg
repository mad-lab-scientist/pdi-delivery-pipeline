[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 20
timeout = 30
stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
# Supply a vault id when you have vaulted vars, e.g.:
#   ansible-playbook playbooks/site.yml --vault-id lab@prompt
# or set ANSIBLE_VAULT_IDENTITY_LIST in your shell / CI (never commit the password).

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

[privilege_escalation]
become_method = sudo
