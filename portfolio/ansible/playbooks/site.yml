---
# Top-level convergence: apply the right roles to each group. Safe to run repeatedly (idempotent).
#   ansible-playbook playbooks/site.yml --check --diff          dry run
#   ansible-playbook playbooks/site.yml --limit web --tags ssh  only SSH hardening on the web group
- name: Linux baseline and hardening
  hosts: linux
  become: true
  roles:
    - role: baseline
      tags: [baseline]
    - role: ssh_hardening
      tags: [ssh, hardening]
    - role: firewall
      tags: [firewall]

- name: Monitoring agent
  hosts: linux
  become: true
  roles:
    - role: node_exporter
      tags: [monitoring]

- name: Docker hosts
  hosts: docker_hosts
  become: true
  roles:
    - role: docker
      tags: [docker]

- name: Windows baseline
  hosts: windows
  gather_facts: true
  roles:
    - role: windows_baseline
      tags: [windows]
