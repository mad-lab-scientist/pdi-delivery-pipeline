---
- name: Install the OpenSSH server
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: Read sshd's supported key exchange algorithms
  ansible.builtin.command: ssh -Q kex
  register: ssh_hardening_supported_kex
  changed_when: false
  check_mode: false

- name: Make sure the main config includes sshd_config.d (first match wins, so the include goes first)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Create the drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the hardening drop-in (validated by sshd before it is installed)
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Allow the SSH port in SELinux when it is not 22
  community.general.seport:
    ports: "{{ ssh_hardening_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - ssh_hardening_port | int != 22
    - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
