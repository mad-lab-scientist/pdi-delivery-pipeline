---
docker_users: []
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
  live-restore: true
  no-new-privileges: true
  userland-proxy: false
  default-address-pools:
    - base: 172.30.0.0/16
      size: 24
