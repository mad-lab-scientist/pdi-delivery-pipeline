---
- name: Set the timezone
  ansible.windows.win_timezone:
    timezone: "{{ windows_baseline_timezone }}"

- name: Configure NTP time sources
  ansible.windows.win_shell: >-
    w32tm /config /manualpeerlist:"{{ windows_baseline_ntp_servers | join(' ') }}" /syncfromflags:manual /update
  when: windows_baseline_ntp_servers | length > 0
  changed_when: true

- name: Set DNS servers on all up adapters
  ansible.windows.win_dns_client:
    adapter_names: '*'
    dns_servers: "{{ windows_baseline_dns_servers }}"
  when: windows_baseline_dns_servers | length > 0

- name: Disable the SMBv1 client and server
  ansible.windows.win_feature:
    name: FS-SMB1
    state: absent
  when: windows_baseline_disable_smbv1
  notify: Reboot pending

- name: Require SMB server signing
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: "{{ item }}"
    data: 1
    type: dword
  loop: [RequireSecuritySignature, EnableSecuritySignature]
  when: windows_baseline_require_smb_signing

- name: Disable legacy TLS and SSL (SCHANNEL)
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\{{ item.0 }}\{{ item.1 }}'
    name: "{{ item.2.name }}"
    data: "{{ item.2.data }}"
    type: dword
  loop: >-
    {{ ['SSL 3.0', 'TLS 1.0', 'TLS 1.1']
       | product(['Server', 'Client'], [{'name': 'Enabled', 'data': 0}, {'name': 'DisabledByDefault', 'data': 1}])
       | list }}
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}/{{ item.2.name }}"
  when: windows_baseline_disable_legacy_tls
  notify: Reboot pending

- name: Require Network Level Authentication for RDP
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    name: UserAuthentication
    data: 1
    type: dword
  when: windows_baseline_rdp_nla

- name: Disable the Print Spooler on non-print servers
  ansible.windows.win_service:
    name: Spooler
    state: stopped
    start_mode: disabled
  when: windows_baseline_disable_print_spooler

- name: Enable the firewall on all profiles
  ansible.windows.win_firewall:
    state: enabled
    profiles: [Domain, Private, Public]
  when: windows_baseline_enable_firewall

- name: Configure the advanced audit policy
  ansible.windows.win_audit_policy_system:
    subcategory: "{{ item.subcategory }}"
    audit_type: "{{ (['success'] if item.success else []) + (['failure'] if item.failure else []) }}"
  loop: "{{ windows_baseline_audit_subcategories }}"
  loop_control:
    label: "{{ item.subcategory }}"
