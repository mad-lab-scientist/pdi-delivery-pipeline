---
- name: Work out the release architecture
  ansible.builtin.set_fact:
    node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armv7'}[ansible_facts['architecture']] | default('amd64') }}"

- name: Create the node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Set the release base URL
  ansible.builtin.set_fact:
    node_exporter_base_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"

- name: Download the release, verified against the published sha256sums.txt
  ansible.builtin.get_url:
    url: "{{ node_exporter_base_url }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    checksum: "sha256:{{ node_exporter_base_url }}/sha256sums.txt"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"

- name: Create the versioned install directory
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}/{{ node_exporter_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack node_exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}/{{ node_exporter_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ node_exporter_install_dir }}/{{ node_exporter_version }}/node_exporter"
  notify: Restart node_exporter

- name: Point /usr/local/bin/node_exporter at this version
  ansible.builtin.file:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_version }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link
    force: true
  notify: Restart node_exporter

- name: Install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Open the metrics port to the monitoring servers (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_listen.split(':')[-1] }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: prometheus
  loop: "{{ node_exporter_allowed_cidrs }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: Open the metrics port to the monitoring servers (firewalld)
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 source address={{ item }} port port={{ node_exporter_listen.split(':')[-1] }} protocol=tcp accept"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ node_exporter_allowed_cidrs }}"
  when: ansible_facts['os_family'] in ['RedHat', 'Suse']
