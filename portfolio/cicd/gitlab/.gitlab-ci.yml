---
# Example GitLab CI/CD pipeline: lint -> test -> build+scan container -> IaC plan -> gated deploy.
# Secrets come from masked/protected CI/CD variables, never from the repo.
stages: [lint, test, build, scan, plan, deploy]

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  TF_ROOT: terraform/environments/prod-aws

default:
  tags: [linux]

# The Terraform image's entrypoint is `terraform`; GitLab needs it cleared to run the job script.
# Exact version: a saved plan can only be applied by the Terraform version that created it.
.terraform:
  image:
    name: hashicorp/terraform:1.16.7
    entrypoint: [""]

# ---------------------------------------------------------------- lint
lint:yaml:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir yamllint==1.38.0
    - yamllint .

lint:shell:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.11.0
  script:
    - shellcheck --version
    - find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck -x

lint:terraform:
  extends: .terraform
  stage: lint
  script:
    - terraform -chdir=terraform fmt -check -recursive

# ---------------------------------------------------------------- test
test:unit:
  stage: test
  image: python:3.12-slim
  script:
    - python -m unittest discover -s portfolio/network/tests -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------- build (rootless kaniko)
build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$DOCKER_IMAGE"
      --reproducible
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------- scan
scan:image:
  stage: scan
  image:
    name: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$DOCKER_IMAGE"
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

scan:iac:
  stage: scan
  image:
    name: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    entrypoint: [""]
  script:
    - trivy config --exit-code 1 --severity HIGH,CRITICAL terraform
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------- IaC plan
plan:terraform:
  extends: .terraform
  stage: plan
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform plan -input=false -out=plan.tfplan
  artifacts:
    paths: ["$TF_ROOT/plan.tfplan"]
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------- deploy (manual gate)
# Restrict who may run this job with a protected environment (GitLab Premium/Ultimate).
deploy:terraform:
  extends: .terraform
  stage: deploy
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform apply -input=false plan.tfplan
  environment:
    name: production
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
