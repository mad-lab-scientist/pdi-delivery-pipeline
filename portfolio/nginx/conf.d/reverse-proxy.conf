# Reverse proxy for an upstream app, with HTTP->HTTPS redirect, TLS, security headers, rate limiting
# and a stricter limit on the login path. Replace the certificate paths and upstream for your service.
upstream app_backend {
    least_conn;
    server 10.20.3.41:8080 max_fails=3 fail_timeout=15s;
    server 10.20.3.42:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Redirect all HTTP to HTTPS (and answer ACME challenges for cert issuance).
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example.com;

    ssl_certificate     /etc/nginx/tls/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/shop.example.com/privkey.pem;
    include snippets/ssl.conf;
    include snippets/security-headers.conf;

    limit_req  zone=general burst=60 nodelay;
    limit_conn perip 20;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://app_backend;
    }
}
