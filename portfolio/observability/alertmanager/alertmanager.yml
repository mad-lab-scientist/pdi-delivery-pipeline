---
# Alertmanager routing: group alerts, mute by severity, send criticals to PagerDuty and the rest to Slack/email.
# Secrets (API URLs, keys) are read from files so they stay out of the repo; see *_file keys.
# Validate:  amtool check-config alertmanager.yml
global:
  resolve_timeout: 5m

route:
  receiver: default-email
  group_by: [alertname, cluster, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: pagerduty
      continue: true
    - matchers:
        - severity =~ "warning|critical"
      receiver: slack
    - matchers:
        - severity = "info"
      receiver: "null"

inhibit_rules:
  # A node that is down suppresses the noisier resource alerts for the same instance.
  - source_matchers: [alertname = "NodeDown"]
    target_matchers: [severity =~ "warning|info"]
    equal: [instance]

receivers:
  - name: "null"

  - name: default-email
    email_configs:
      - to: ops@example.com
        from: alertmanager@example.com
        smarthost: smtp.example.com:587
        auth_username: alertmanager@example.com
        auth_password_file: /etc/alertmanager/secrets/smtp_password
        require_tls: true

  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook
        channel: "#alerts"
        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_key
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonLabels.alertname }} on {{ .CommonLabels.cluster }}'
        send_resolved: true
