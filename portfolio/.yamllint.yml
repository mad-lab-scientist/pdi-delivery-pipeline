---
# yamllint config for the whole portfolio (ansible/, cloud/, ci configs).
extends: default
rules:
  line-length:
    max: 160
    level: warning
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
ignore: |
  ansible/collections/
  **/node_modules/
