---
# CI for the infrastructure & security toolkit: lints and tests every language and tool in portfolio/.
# Actions are pinned to commit SHAs. Published to the public repo as .github/workflows/portfolio-ci.yml.
name: portfolio-ci
on:
  push:
    paths: ["portfolio/**", ".github/workflows/portfolio-ci.yml"]
  pull_request:
    paths: ["portfolio/**"]
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: pip install ruff==0.17.2
      - name: Ruff
        run: ruff check portfolio
      - name: Unit tests
        run: |
          (cd portfolio/network/tests && python -m unittest)
          (cd portfolio/kali/tests && python -m unittest)

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: ShellCheck (preinstalled on the runner)
        run: find portfolio -name '*.sh' -print0 | xargs -0 -r shellcheck -x

  powershell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          ./portfolio/tools/Invoke-PowerShellLint.ps1

  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: pip install yamllint==1.38.0
      - run: yamllint -c portfolio/.yamllint.yml portfolio

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: "1.16.7"}
      - name: fmt
        run: terraform -chdir=portfolio/terraform fmt -check -recursive
      - name: IaC scan (Trivy, fails on HIGH/CRITICAL)
        run: >-
          docker run --rm -v "$PWD/portfolio/terraform:/src:ro"
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          config --exit-code 1 --severity HIGH,CRITICAL /src
      - name: validate modules and environments
        run: |
          for d in portfolio/terraform/modules/* portfolio/terraform/environments/*; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: pip install ansible-core==2.21.5 ansible-lint==26.10.1
      - name: Install collections and lint
        working-directory: portfolio/ansible
        env:
          ANSIBLE_COLLECTIONS_PATH: ./collections
        run: |
          ansible-galaxy collection install ansible.posix community.general ansible.windows community.windows -p ./collections
          for pb in playbooks/site.yml playbooks/patch-linux.yml; do
            ansible-playbook --syntax-check -i inventories/lab/hosts.yml "$pb"
          done
          ansible-lint -q roles playbooks/site.yml playbooks/patch-linux.yml

  config-management:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Puppet validate (via gem)
        run: |
          sudo gem install puppet --no-document
          cm=portfolio/config-management
          puppet parser validate "$cm/puppet/modules/profile/manifests/base.pp"
          for t in "$cm"/puppet/modules/profile/templates/*.epp; do puppet epp validate "$t"; done
      - name: Chef recipe syntax (ruby -c)
        run: |
          cb=portfolio/config-management/chef/cookbooks/baseline
          for f in "$cb"/recipes/*.rb "$cb"/attributes/*.rb "$cb"/metadata.rb; do ruby -c "$f"; done

  prometheus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: promtool check config and rules
        run: |
          docker run --rm -v "$PWD/portfolio/observability/prometheus:/p" \
            --entrypoint promtool prom/prometheus:v3.1.0 check config /p/prometheus.yml

  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Install kustomize, kubeconform, helm (checksum-verified)
        run: |
          cd /tmp
          curl -fsSLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz
          # SHA-256 values from each project's published checksums (verified 2026-10-27)
          sha256sum --check --strict - <<'EOF'
          6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77  kustomize_v5.5.0_linux_amd64.tar.gz
          95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform-linux-amd64.tar.gz
          f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea  helm-v3.16.3-linux-amd64.tar.gz
          EOF
          tar -xzf kustomize_v5.5.0_linux_amd64.tar.gz kustomize
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          tar -xzf helm-v3.16.3-linux-amd64.tar.gz linux-amd64/helm
          sudo mv kustomize kubeconform linux-amd64/helm /usr/local/bin/
      - name: Validate manifests and chart
        run: |
          kustomize build portfolio/containers/kubernetes/web-app \
            | kubeconform -strict -summary -kubernetes-version 1.31.0 -ignore-missing-schemas
          helm lint portfolio/containers/helm/web-service
          helm template web portfolio/containers/helm/web-service \
            | kubeconform -strict -summary -kubernetes-version 1.31.0 -ignore-missing-schemas

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Hadolint
        run: |
          docker run --rm -i \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --failure-threshold warning - < portfolio/containers/dockerfiles/node-app.Dockerfile
