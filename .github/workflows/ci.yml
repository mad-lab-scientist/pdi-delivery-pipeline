name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build
        run: node website/build.mjs
      - name: Test suite (showcase mode)
        run: node website/test/run-tests.mjs
        env:
          PDI_PUBLIC_SHOWCASE: '1'
      - name: Secret scan
        run: node ci/scan-secrets.mjs
