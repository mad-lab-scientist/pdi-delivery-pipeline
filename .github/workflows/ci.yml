name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build
        run: node website/build.mjs
      - name: Test suite (showcase mode)
        run: node website/test/run-tests.mjs
        env:
          PDI_PUBLIC_SHOWCASE: '1'
      - name: Secret scan
        run: node ci/scan-secrets.mjs
